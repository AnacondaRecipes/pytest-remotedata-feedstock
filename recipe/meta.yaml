{% set name = "pytest-remotedata" %}
{% set version = "0.4.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_') }}-{{ version }}.tar.gz
  sha256: ad3eaa2691feecc2071890764d30e06211547577f965e2e4424435c5d887278d

build:
  # upstream python_requires >=3.9 (dropped support for Python < 3.9 in 0.4.2)
  skip: true  # [py<39]
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python
    - pip
    - setuptools >=77.0.1
    - setuptools_scm
  run:
    - python
    - pytest >=5.0
    - packaging

test:
  source_files:
    - tests/
  imports:
    - pytest_remotedata
  requires:
    - pip
    - pytest
  commands:
    - pip check
    - pytest tests -vv -k "not (test_block_internet_connection or test_block_internet_connection_internet_off or test_local_config)"

about:
  home: https://github.com/astropy/pytest-remotedata
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE.rst
  summary: Pytest plugin for controlling remote data access
  description: |
    This package provides a plugin for the pytest framework that allows
    developers to control unit tests that require access to data from the
    internet.
  doc_url: https://github.com/astropy/pytest-remotedata
  dev_url: https://github.com/astropy/pytest-remotedata

extra:
  recipe-maintainers:
    - astrofrog-conda-forge
    - drdavella
    - mwcraig
